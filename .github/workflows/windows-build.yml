name: Build Windows Installer

# Mirrors the Android repo's android-build.yml: builds the desktop app on
# GitHub's windows-latest runner so nobody needs Rust/the Windows SDK
# installed locally, then uploads the NSIS installer as a workflow
# artifact you can download from the Actions run summary.
#
# Unsigned by default (tauri.conf.json -> bundle.windows.certificateThumbprint
# is null). Set the three WINDOWS_* secrets below to get a signed installer
# instead — see docs/release-signing.md for how to get a certificate.
#
# Status: written against Tauri's documented Windows CI recipe, not
# verified against a real GitHub Actions run or a real certificate.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only runs when WINDOWS_CERTIFICATE_BASE64 is set as a repo secret.
      # Decodes the base64-encoded .pfx, imports it into the runner's cert
      # store, and patches tauri.conf.json with the resulting thumbprint so
      # `tauri build` signs the .exe and the NSIS installer automatically.
      - name: Import signing certificate (if configured)
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "release-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword

          $thumbprint = $cert.Thumbprint
          Write-Output "Imported certificate with thumbprint $thumbprint"

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows.certificateThumbprint = $thumbprint
          $config | ConvertTo-Json -Depth 32 | Set-Content $configPath

          Remove-Item $certPath

      - name: Build installer
        run: npm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: truff-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: error
